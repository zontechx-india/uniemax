<!doctype html>
<html lang="en" data-app="seller">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Seller · UnieMax prototype</title>
    <link rel="icon" href="/app_logo.png" />
    <!-- Light/dark before the first paint (same key as the real app). -->
    <script>try{var m=localStorage.getItem('uniemax-theme');if(m==='dark'||m==='light')document.documentElement.dataset.theme=m}catch(e){}</script>
    <!-- Cascade-layer order first, so the stylesheets below stack as in the real build. -->
    <style>@layer theme, base, components, utilities;</style>
    <!-- @index-css : server.js puts the real frontend/src/index.css here -->
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body>
    <div id="app"></div>

    <!-- Fixed order. Each file adds global objects the next ones use. -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.11/dist/index.global.js"></script>
    <script src="js/icons.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/data.js"></script>
    <script src="js/catalog.js"></script>
    <script src="js/store.js"></script>
    <script src="js/plans.js"></script>
    <script src="js/bills.js"></script>
    <script src="js/router.js"></script>
    <script src="js/screens/auth.js"></script>
    <script src="js/screens/seller.js"></script>
    <script src="js/screens/seller-plans.js"></script>
    <script src="js/screens/seller-bills.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
