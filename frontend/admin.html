<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Both UI fonts are on every screen: fetch them with the document
         instead of after the CSS is parsed (fewer fallback-font flashes). -->
    <link rel="preload" href="/fonts/PlusJakartaSans-Latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="icon" type="image/png" href="/app_logo.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin · UnieMax</title>

    <!--
      Installable app (PWA) on the admin host (admin.uniemax.com). Without the
      manifest, Chrome offers only "create shortcut", which opens in a normal
      tab with the URL bar showing. The manifest's start_url/scope are `/`,
      which is only right on the admin host — `src/admin/main.tsx` removes this
      link when the console is opened at /admin on a storefront host. The
      service worker is registered there too (`shared/serviceWorker.ts`).
      theme-color is rewritten at runtime by `shared/theme/mode.ts`.
    -->
    <link rel="manifest" href="/manifest-admin.json" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="UM Admin" />
    <!-- Dev host → "UM Admin DEV" with an A-DEV badge (see index.html). -->
    <script>
      (function () {
        var h = location.hostname
        if (!/(^|\.)dev\.uniemax\.zontechx\.com$/.test(h) && h !== 'localhost' && !/\.localhost$/.test(h)) return
        document.querySelector('link[rel="manifest"]').href = '/manifest-admin-dev.json'
        document.querySelector('link[rel="apple-touch-icon"]').href = '/apple-touch-icon-admin-dev.png'
        document.querySelector('meta[name="apple-mobile-web-app-title"]').content = 'UM Admin DEV'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/admin/main.tsx"></script>
  </body>
</html>
