<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Both UI fonts are on every screen: fetch them with the document
         instead of after the CSS is parsed (fewer fallback-font flashes). -->
    <link rel="preload" href="/fonts/PlusJakartaSans-Latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/Fraunces-Latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="icon" type="image/png" href="/app_logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      SEO/social defaults — they describe the PLATFORM, never a page.
      How SEO works on this platform: docs/SEO.md (the source of truth).

      Every page meant to be found or shared (/, /sell, /store/**, /c/**) is
      served through the API, which replaces everything between the two seo
      markers below with that page's own title, description, canonical,
      social card and JSON-LD (backend/src/modules/seo/pageHead.ts) — with
      absolute URLs, which link previews and crawlers that never run
      JavaScript need. Every other URL (cart, account, the seller console) is
      this file as built.

      og-image.jpg is the platform's 1200×630 card, rendered from
      app_logo_with_name.png by the same function that makes store cards
      (renderCardImage in backend/src/package/storage/images.ts).

      `shared/seo.ts` rewrites the same tags per route once React mounts, and
      reads its fallbacks from here. Keep the markers, and keep each tag's
      attributes in the order written (the API reads the defaults back out
      of this block).
    -->
    <!-- seo:start -->
    <title>UnieMax — Online Shops You Can Buy From Directly</title>
    <meta
      name="description"
      content="Discover independent online shops on UnieMax and order directly from the seller — clothing, sports gear, electronics, groceries and more, with cash on delivery or secure online payment."
    />
    <meta name="robots" content="index, follow" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="UnieMax" />
    <meta property="og:title" content="UnieMax — Online Shops You Can Buy From Directly" />
    <meta
      property="og:description"
      content="Discover independent online shops on UnieMax and order directly from the seller."
    />
    <meta property="og:image" content="/og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="UnieMax — Online Shops You Can Buy From Directly" />
    <meta
      name="twitter:description"
      content="Discover independent online shops on UnieMax and order directly from the seller."
    />
    <meta name="twitter:image" content="/og-image.jpg" />
    <!-- seo:end -->

    <!--
      Installable app (PWA). Without the manifest below, Chrome offers only
      "create shortcut" — a bookmark that opens in a normal tab with the URL
      bar showing. `display: standalone` in the manifest is what makes the
      installed icon open its own window with no browser chrome.

      Android needs square 192 + 512 icons (the portrait app_logo.png does not
      qualify) and a service worker with a fetch handler — see
      `public/push-sw.js` and `shared/serviceWorker.ts`.

      The single theme-color meta is rewritten at runtime by
      `shared/theme/mode.ts`: the app's light/dark choice is a stored
      preference, NOT prefers-color-scheme, so a media-query pair here would
      follow the phone instead of the app and strand a light app under a dark
      status bar. The value is the `--surface` of each scheme, since that is
      what the header paints directly under the status bar.
    -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- iOS ignores the manifest's display mode and reads these instead. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="UnieMax" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="facebook-domain-verification" content="hzwrc7p4jokp01me9bp8euoddg1j7i" />

    <!-- Meta Pixel Code -->
    <script>
      !function(f,b,e,v,n,t,s)
      {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
      n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s)}(window, document,'script',
      'https://connect.facebook.net/en_US/fbevents.js');
      fbq('init', '931826082697608');
      fbq('track', 'PageView');
    </script>
    <!-- End Meta Pixel Code -->

    <!--
      Google Analytics 4 (G-5L4JD4WH2V) — Google's gtag.js snippet, loaded only
      on the production hosts so dev, previews and localhost never pollute the
      reports. In the head, before the bundle, because most ad visitors leave
      before the app has booted and would otherwise go uncounted. SPA
      navigations are picked up by the stream's Enhanced measurement ("page
      changes based on browser history events"), so the app sends no
      page_view of its own; commerce and sign-up events come from
      `shared/analytics/ga4.ts`.
    -->
    <script>
      (function () {
        var id = 'G-5L4JD4WH2V';
        if (!/^(www\.)?uniemax\.com$/.test(location.hostname)) return;
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=' + id;
        document.head.appendChild(s);
        window.dataLayer = window.dataLayer || [];
        window.gtag = function () { dataLayer.push(arguments); };
        gtag('js', new Date());
        gtag('config', id);
      })();
    </script>
    <!--
      The base snippet only reports the FIRST url of a visit: this is a
      client-side-routed SPA, so every later navigation is reported by
      `shared/analytics/metaPixel.ts` instead. CompleteRegistration lives
      there too. The admin console (admin.html) deliberately has no pixel.
    -->
  </head>
  <body>
    <!-- Meta Pixel no-JS fallback. Lives in <body>: an <img> inside a
         <noscript> in <head> is invalid HTML (parse5 warned on every build). -->
    <noscript><img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=931826082697608&ev=PageView&noscript=1"
    /></noscript>
    <!-- Shown until the app's JavaScript runs (React replaces it). On a slow
         phone connection this is the difference between a blank white page —
         which people close — and one that says it is on its way. Inline
         styles only: nothing else has loaded yet. -->
    <div id="root"><div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:#6b7280;font-size:14px"><div style="width:32px;height:32px;border-radius:50%;border:3px solid rgba(124,58,237,.2);border-top-color:#7c3aed;animation:um-spin .8s linear infinite"></div><p style="margin:0">Opening the shop…</p><style>@keyframes um-spin{to{transform:rotate(360deg)}}</style></div></div>
    <script type="module" src="/src/storefront/main.tsx"></script>
  </body>
</html>
